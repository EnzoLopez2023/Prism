# deployment-diagnostics-v1 foundation:
# https://github.com/EnzoLopez2023/azure-infra/tree/f45790e9df7c9fabbc53dd04e6055a59d6f28f39/deployment-diagnostics
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: prism
  DIAGNOSTIC_RECORDS: deployment-diagnostics/records.jsonl

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: App icon gate
        run: npm run icons:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: No-Postgres gate
        run: npm run check:no-postgres

      - name: Build
        run: npm run build

      - name: Dependency audit diagnostic
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: source-dependency-audit
          category: source-audit
          phase: pre-build
          report: deployment-diagnostics/reports/npm-audit.json
          report-format: npm-audit-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          run: >-
            mkdir -p deployment-diagnostics/reports &&
            npm audit --omit=dev --audit-level=high --json
            > deployment-diagnostics/reports/npm-audit.json

      - name: Source SBOM diagnostic
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: source-sbom
          category: sbom
          phase: pre-build
          report: deployment-diagnostics/reports/source-sbom.cdx.json
          report-format: cyclonedx-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          run: >-
            mkdir -p deployment-diagnostics/reports &&
            npm sbom --sbom-format cyclonedx
            > deployment-diagnostics/reports/source-sbom.cdx.json

      - name: Aggregate validation diagnostics
        if: always()
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: aggregate
          category: nested-checker
          phase: pre-build
          mode: aggregate
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Upload validation diagnostic evidence
        id: upload_validate_diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: deployment-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-validate
          path: deployment-diagnostics/
          retention-days: 30

      - name: Warn if validation diagnostic upload failed
        if: always() && steps.upload_validate_diagnostics.outcome == 'failure'
        run: >-
          echo "::warning title=Deployment diagnostics upload::Validation diagnostic evidence could not be uploaded;
          diagnostics remain non-blocking, but this run requires log-based review."

  docker:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg PRISM_BUILD_VERSION=${{ github.sha }} \
            --build-arg PRISM_BUILD_NUMBER=${{ github.run_number }} \
            --build-arg PRISM_BUILD_COMMIT=${{ github.sha }} \
            --build-arg "PRISM_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t prism:ci-${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name prism-smoke \
            -e PRISM_AUTH_MODE=development \
            -e NODE_ENV=development \
            -e PRISM_DB_PATH=/tmp/prism.db \
            -e PRISM_ARTIFACT_ROOT=/tmp/prism-artifacts \
            prism:ci-${{ github.sha }}
          sleep 5
          docker logs prism-smoke
          docker exec prism-smoke node -e "fetch('http://127.0.0.1:3000/api/live').then(r=>r.json()).then(j=>{if(j.status!=='live')process.exit(1);console.log(JSON.stringify(j))}).catch(()=>process.exit(1))"
          docker exec prism-smoke node -e "fetch('http://127.0.0.1:3000/api/version').then(r=>r.json()).then(j=>{if(j.app!=='prism')process.exit(1);console.log(JSON.stringify(j))}).catch(()=>process.exit(1))"
          docker stop prism-smoke

  build-and-push:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Compute image metadata
        id: meta
        run: |
          TAG="${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::8}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        run: |
          docker build \
            --build-arg PRISM_BUILD_VERSION=${{ github.sha }} \
            --build-arg PRISM_BUILD_NUMBER=${{ github.run_number }} \
            --build-arg PRISM_BUILD_COMMIT=${{ github.sha }} \
            --build-arg "PRISM_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t ${{ steps.meta.outputs.tag }} .
          docker push ${{ steps.meta.outputs.tag }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ steps.meta.outputs.tag }} | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        id: image_sbom
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Record exact-image SBOM diagnostic
        if: always()
        uses: ./.github/actions/deployment-diagnostic
        env:
          DIAGNOSTIC_CANDIDATE_DIGEST: ${{ steps.push.outputs.digest }}
        with:
          check-id: image-sbom
          category: sbom
          phase: pre-activation
          mode: record
          exit-code: ${{ steps.image_sbom.outcome == 'success' && '0' || '1' }}
          report: sbom.spdx.json
          report-format: spdx-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Scan exact image for HIGH and CRITICAL vulnerabilities
        id: image_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Record image vulnerability diagnostic
        if: always()
        uses: ./.github/actions/deployment-diagnostic
        env:
          DIAGNOSTIC_CANDIDATE_DIGEST: ${{ steps.push.outputs.digest }}
        with:
          check-id: image-vulnerability-scan
          category: image-scan
          phase: pre-activation
          mode: record
          exit-code: ${{ steps.image_scan.outcome == 'success' && '0' || '1' }}
          report: trivy.json
          report-format: trivy-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Upload SBOM
        id: upload_sbom
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Warn if SBOM upload failed
        if: always() && steps.upload_sbom.outcome == 'failure'
        run: >-
          echo "::warning title=SBOM upload::The existing SBOM artifact could not be uploaded;
          image diagnostics remain non-blocking, but this run requires log-based review."

      - name: Annotate absent signing prerequisites
        run: |
          echo "::warning title=Deployment diagnostics: signature-verification (skipped-no-prerequisite)::Prism's candidate image is not signed by the current workflow; verification is recorded as skipped and does not block deployment."
          echo "::warning title=Deployment diagnostics: provenance-attestation-verification (skipped-no-prerequisite)::The current workflow attaches no provenance or SBOM attestation; verification is recorded as skipped and does not block deployment."

      - name: Record absent signature prerequisite
        uses: ./.github/actions/deployment-diagnostic
        env:
          DIAGNOSTIC_CANDIDATE_DIGEST: ${{ steps.push.outputs.digest }}
        with:
          check-id: signature-verification
          category: signature-provenance
          phase: pre-activation
          mode: skip
          reason: Candidate signing is not performed by Prism's current build-and-push operation.
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Record absent attestation prerequisite
        uses: ./.github/actions/deployment-diagnostic
        env:
          DIAGNOSTIC_CANDIDATE_DIGEST: ${{ steps.push.outputs.digest }}
        with:
          check-id: provenance-attestation-verification
          category: signature-provenance
          phase: pre-activation
          mode: skip
          reason: Prism's current build-and-push operation attaches no provenance or SBOM attestations.
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Aggregate image diagnostics
        if: always()
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: aggregate
          category: nested-checker
          phase: pre-activation
          mode: aggregate
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Upload image diagnostic evidence
        id: upload_image_diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: deployment-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-build-and-push
          path: |
            deployment-diagnostics/
            sbom.spdx.json
            trivy.json
          retention-days: 30

      - name: Warn if image diagnostic upload failed
        if: always() && steps.upload_image_diagnostics.outcome == 'failure'
        run: >-
          echo "::warning title=Deployment diagnostics upload::Image diagnostic evidence could not be uploaded;
          diagnostics remain non-blocking, but this run requires log-based review."

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    env:
      DIAGNOSTIC_CANDIDATE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
    permissions:
      id-token: write
      contents: read
      packages: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Capture current deployment digest
        id: current
        run: |
          CURRENT=$(az webapp config container show \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --name ${{ vars.WEBAPP_NAME }} \
            --query "[?name==\`DOCKER_CUSTOM_IMAGE_NAME\`].value" -o tsv 2>/dev/null || echo "")
          echo "image=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Migration compatibility diagnostic
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: migration-compatibility-precheck
          category: migration-precondition
          phase: pre-activation
          report: deployment-diagnostics/reports/migration-compatibility.json
          report-format: generic-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          run: >-
            mkdir -p deployment-diagnostics/reports &&
            node scripts/deployment-checks.mjs migration
            > deployment-diagnostics/reports/migration-compatibility.json

      - name: Recovery freshness diagnostic
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: recovery-precondition-precheck
          category: recovery-precondition
          phase: pre-activation
          report: deployment-diagnostics/reports/recovery-precondition.json
          report-format: generic-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          run: >-
            mkdir -p deployment-diagnostics/reports &&
            node scripts/deployment-checks.mjs recovery
            > deployment-diagnostics/reports/recovery-precondition.json

      - name: Current production readiness diagnostic
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: readiness-precondition-precheck
          category: readiness-precondition
          phase: pre-activation
          report: deployment-diagnostics/reports/readiness-precondition.json
          report-format: generic-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          run: >-
            mkdir -p deployment-diagnostics/reports &&
            node scripts/deployment-checks.mjs readiness
            --url "https://${{ vars.WEBAPP_NAME }}.azurewebsites.net/api/ready"
            > deployment-diagnostics/reports/readiness-precondition.json

      - name: Annotate absent monitoring prerequisite
        run: >-
          echo "::warning title=Deployment diagnostics: monitoring-precheck (skipped-no-prerequisite)::Prism's
          reviewed infrastructure profile defines no app-owned alert or availability resources;
          monitoring verification is recorded as skipped and does not block deployment."

      - name: Record absent monitoring prerequisite
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: monitoring-precheck
          category: monitoring-precheck
          phase: pre-activation
          mode: skip
          reason: Prism's reviewed infrastructure profile defines no app-owned alert or availability resources.
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Protected configuration diagnostic
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: protected-configuration-precheck
          category: protected-configuration-precheck
          phase: pre-activation
          report: deployment-diagnostics/reports/protected-configuration.json
          report-format: generic-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          run: >-
            mkdir -p deployment-diagnostics/reports &&
            node scripts/deployment-checks.mjs protected-config
            --resource-group "${{ vars.RESOURCE_GROUP }}"
            --webapp-name "${{ vars.WEBAPP_NAME }}"
            > deployment-diagnostics/reports/protected-configuration.json

      - name: Deploy by digest
        id: deploy
        run: |
          DIGEST_IMAGE="${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}"
          echo "Deploying $DIGEST_IMAGE to ${{ vars.WEBAPP_NAME }}"
          az webapp config container set \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --name ${{ vars.WEBAPP_NAME }} \
            --container-image-name "$DIGEST_IMAGE" \
            --container-registry-url "https://${{ vars.ACR_NAME }}.azurecr.io"
          az webapp restart \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --name ${{ vars.WEBAPP_NAME }}

      - name: Smoke test
        id: smoke
        run: |
          SITE_URL="https://${{ vars.WEBAPP_NAME }}.azurewebsites.net"
          echo "Waiting for deployment at $SITE_URL..."
          for _ in $(seq 1 30); do
            if curl -sf "$SITE_URL/api/live" | grep -q '"status":"live"'; then
              echo "Live check passed"
              VERSION=$(curl -sf "$SITE_URL/api/version")
              echo "Version: $VERSION"
              if echo "$VERSION" | grep -q "${{ github.sha }}"; then
                echo "Version matches commit"
                READY=$(curl -sf "$SITE_URL/api/ready" || echo '{"status":"not-ready"}')
                echo "Ready: $READY"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Smoke test failed after 300s"
          exit 1

      - name: Rollback on failure
        if: (failure() || cancelled()) && steps.deploy.outcome == 'success'
        run: |
          echo "::warning::Deployment failed smoke test, triggering rollback"
          PREV="${{ steps.current.outputs.image }}"
          if [ -n "$PREV" ]; then
            az webapp config container set \
              --resource-group ${{ vars.RESOURCE_GROUP }} \
              --name ${{ vars.WEBAPP_NAME }} \
              --container-image-name "$PREV" \
              --container-registry-url "https://${{ vars.ACR_NAME }}.azurecr.io" || true
            az webapp restart \
              --resource-group ${{ vars.RESOURCE_GROUP }} \
              --name ${{ vars.WEBAPP_NAME }} || true
          else
            echo "::warning::No previous image found, cannot rollback"
          fi

      - name: Aggregate deployment diagnostics
        if: always()
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: aggregate
          category: nested-checker
          phase: pre-activation
          mode: aggregate
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Upload deployment diagnostic evidence
        id: upload_deploy_diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: deployment-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-deploy
          path: deployment-diagnostics/
          retention-days: 30

      - name: Warn if deployment diagnostic upload failed
        if: always() && steps.upload_deploy_diagnostics.outcome == 'failure'
        run: >-
          echo "::warning title=Deployment diagnostics upload::Deployment diagnostic evidence could not be uploaded;
          diagnostics remain non-blocking, but this run requires log-based review."
